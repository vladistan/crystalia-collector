---
id: https://w3id.org/crystalia
name: crystalia-datamodel
title: Crystalia Data Model
version: 2.0.0
description: |-
  Data model for the Crystalia dataset annotation model.

  v2: descriptors are content-addressed and intrinsic. Coverage is never
  stored (computed from the descriptor's type by `crystalia_data_model.types`);
  `offset` is permitted only on positional descriptors; `total` only on
  region/stream composites; `length` is always the number of bytes hashed.
  Descriptor type semantics (hierarchy, grade, robustness, strength) live in
  the Python type registry, not in the schema. Methods are content-addressed
  and each harvest run is recorded once as a HarvestRecord.
license: MIT
see_also:
  - https://vladistan.github.com/crystalia-collector

prefixes:
  crys: https://w3id.org/crystalia/
  linkml: https://w3id.org/linkml/
  cryd: https://crystalia.link/data/

  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xml: http://www.w3.org/XML/1998/namespace
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  dct: http://purl.org/dc/terms/
  dcmi: http://purl.org/dc/dcmitype/
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/


default_prefix: crys
default_range: string

imports:
  - linkml:types

classes:
  Thing:
    class_uri: crys:Thing
    description: "Anything that has an id"
    slots:
      - id

  DescribableThing:
    is_a: Thing
    class_uri: crys:DescribableThing
    description: An item that can be described by one or more descriptors. Could be an item(file) or another descriptor
    slots:
      - hasDescriptor

  Item:
    is_a: DescribableThing
    class_uri: crys:Item
    description: An individual item for example a file
    slots:
      - label
      - isPartOf

  Descriptor:
    is_a: DescribableThing
    class_uri: crys:Descriptor
    description: >-
      A content-addressed descriptor for the whole or part of an item or another
      descriptor. Its id is minted by the canonical encoder from its type, its
      intrinsic fields and its child descriptor ids; coverage is not stored.
    attributes:
      - label:
          slot_uri: rdfs:label
          required: false
          description: A human-readable label
    slots:
      - hasType
      - value
      - offset
      - length
      - total
      - assertedCoverage

  Method:
    is_a: Thing
    class_uri: crys:Method
    description: >-
      A method used to generate descriptors. Content-addressed: one node per
      (name, canonical parameter set), reused across harvests.
    slots:
      - label
      - comment
      - parameters

  HarvestRecord:
    is_a: Thing
    class_uri: crys:HarvestRecord
    description: >-
      One record per harvest run: when it ran, which collector produced it,
      where it started, which methods it used and which root items it produced.
    slots:
      - startedAt
      - endedAt
      - collectorVersion
      - sourceRoot
      - usesMethod
      - hasRoot

slots:
  id:
    description: >-
      A unique identifier
    identifier: true
    required: true
    range: uriorcurie

  label:
    description: A human-readable label for the item, most often the filename
    range: string
    required: true
    slot_uri: rdfs:label

  comment:
    description: A description of the item
    range: string
    required: false
    slot_uri: rdfs:comment

  isPartOf:
    description: >-
      The parent item (e.g. the directory containing a file)
    multivalued: false
    required: false
    range: Item
    slot_uri: dct:isPartOf

  hasDescriptor:
    description: >-
      The descriptors associated with an item, or the child descriptors of a
      composite descriptor
    multivalued: true
    range: uriorcurie
    slot_uri: crys:hasDescriptor

  hasType:
    description: The type of the descriptor (a `cryd:desc-type/<name>` IRI resolved by the type registry)
    range: uriorcurie
    required: true
    multivalued: false
    slot_uri: crys:hasType

  value:
    description: The value of the descriptor
    range: string
    required: true
    multivalued: false
    slot_uri: crys:value

  offset:
    description: >-
      The starting byte offset of a positional descriptor. Permitted only on
      positional descriptors; part of their identity.
    range: integer
    minimum_value: 0
    unit:
      ucum_code: byte
    required: false
    multivalued: false
    slot_uri: crys:offset

  length:
    description: >-
      The number of bytes hashed. Required on hash descriptors and part of
      their identity; absent on all other descriptors.
    range: integer
    minimum_value: 0
    unit:
      ucum_code: byte
    required: false
    multivalued: false
    slot_uri: crys:length

  total:
    description: >-
      The number of parts expected by a region/stream composite. Required on
      region composites, forbidden everywhere else (folder rollups are complete
      by construction and carry no total).
    range: integer
    minimum_value: 1
    required: false
    multivalued: false
    slot_uri: crys:total

  assertedCoverage:
    description: >-
      Coverage asserted by an opaque producer, in [0, 1]. Used only by the
      `asserted` descriptor type; every other type's coverage is computed.
    range: float
    minimum_value: 0
    maximum_value: 1
    required: false
    multivalued: false
    slot_uri: crys:assertedCoverage

  parameters:
    description: >-
      The canonical parameter string of a method (sorted, length-prefixed
      `key=len:value` lines). Part of the method's content address.
    range: string
    required: false
    multivalued: false
    slot_uri: crys:parameters

  startedAt:
    description: When the harvest started
    range: datetime
    required: false
    multivalued: false
    slot_uri: crys:startedAt

  endedAt:
    description: When the harvest ended
    range: datetime
    required: false
    multivalued: false
    slot_uri: crys:endedAt

  collectorVersion:
    description: The version of the collector that produced the harvest
    range: string
    required: false
    multivalued: false
    slot_uri: crys:collectorVersion

  sourceRoot:
    description: The root the harvest started from (path, URL or bucket prefix)
    range: string
    required: false
    multivalued: false
    slot_uri: crys:sourceRoot

  usesMethod:
    description: The methods used by the harvest
    range: Method
    required: false
    multivalued: true
    slot_uri: crys:usesMethod

  hasRoot:
    description: The root items produced by the harvest
    range: Item
    required: false
    multivalued: true
    slot_uri: crys:hasRoot
