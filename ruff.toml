target-version = "py313"
line-length = 120
src = ["src", "tests"]
exclude = [
  ".claude",
  "data_model",
  # Vendored generated / fork code (see src/*/VENDORED.md) is not linted.
  "src/crystalia_data_model",
  "src/crystalia_collector/_vendor"
]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]

[lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D"]
"src/crystalia_collector/method/md5.py" = ["N801"]
