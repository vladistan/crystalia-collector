[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crystalia-collector"
version = "0.1.1"
description = "Crystalia Collector: Generate Dataset Descriptors for Large Datasets"
readme = "README.md"
authors = [
  {name = "Vlad Korolev", email = "vlad@v-lad.org"}
]
maintainers = [
  {name = "Vlad Korolev", email = "vlad@v-lad.org"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.4.0",
    "toml>=0.10.2",
    "boto3>=1.18.0",
    "linkml-runtime>=1.10.0",
    "crystalia-data-model",
]
keywords = ["knowledge-graph", "provenance", "data-engineering"]
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "coverage>=6.0",
    "mypy>=0.910",
    "pytest>=6.2",
    "pytest-cov>=4.0",
    "ruff>=0.3.5",
]

[project.scripts]
crystalia-collector = "crystalia_collector.app:app"

[project.urls]
bugs = "https://github.com/Ebiquity/crystalia-collector/issues"
changelog = "https://github.com/Ebiquity/crystalia-collector/blob/master/changelog.md"
homepage = "https://github.com/Ebiquity/crystalia-collector"

[tool.hatch.build.targets.wheel]
packages = ["src/crystalia_collector"]

# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

# Pytest
# ------

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--ignore=legacy --ignore=data_model"

# Coverage
# --------

[tool.coverage.run]
source = ["crystalia_collector"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv.sources]
crystalia-data-model = { path = "../crystalia-data-model", editable = true }
